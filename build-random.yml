name: Build random.json

on:
  push:
    branches: [main]
    paths: ["data/random/**"]   # only fires when a tile file changes
  workflow_dispatch: {}          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-random
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild data/random.json from tiles
        run: node scripts/build-random.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/random.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/random.json
            git commit -m "chore: rebuild data/random.json from tiles"
            git push
          else
            echo "No changes to data/random.json."
          fi
