backend:
  name: github
  repo: bootlegpirates/cptnkid-site
  branch: main
# Where uploaded images are stored / linked from.
# Working thumbs live at the repo root under images/uploads and the site
# serves them from /images/uploads, so media_folder must point there too
# (NOT static/images/uploads, or new uploads 404 on the live site).
media_folder: "images/uploads"
public_folder: "/images/uploads"
collections:
  # ============================================================
  # TIMELINE / POSTS  →  data/posts.json   (unchanged)
  # ============================================================
  - name: "content"
    label: "Posts"
    files:
      - name: "posts"
        label: "All posts"
        file: "data/posts.json"
        format: "json"
        fields:
          - name: "posts"
            label: "Posts"
            label_singular: "Post"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "title",       label: "Title",                           widget: "string" }
              - { name: "category",    label: "Category",                        widget: "select", options: ["Movies", "Anime", "Docs", "Work"] }
              - { name: "rating",      label: "Rating (0-5 stars)",              widget: "number", value_type: "int", min: 0, max: 5, default: 0 }
              - { name: "description", label: "Description",                     widget: "text" }
              - { name: "tags",        label: "Tags (comma separated)",          widget: "string", required: false }
              - { name: "featured",    label: "Featured on homepage",            widget: "boolean", default: false }
              - { name: "image",       label: "Main image",                      widget: "image",  required: false }
              - { name: "video",       label: "Detail-page video (YouTube URL)", widget: "string", required: false }
              - name: "featuredTitle"
                label: "Featured card — title override"
                widget: "string"
                required: false
                hint: "Only shown on the homepage FEATURED card. Leave blank to reuse the Title above."
              - name: "featuredDesc"
                label: "Featured card — description override"
                widget: "text"
                required: false
                hint: "Only shown on the homepage FEATURED card. Leave blank to reuse the first sentence of Description above."
              - name: "featuredTags"
                label: "Featured card — small tags"
                widget: "list"
                required: false
                max: 4
                summary: "{{fields.label}}"
                hint: "The small pill labels overlaid on the FEATURED card image (e.g. NEW, EPISODE)."
                fields:
                  - { name: "label", label: "Label", widget: "string" }
                  - { name: "kind",  label: "Style",  widget: "select", options: ["default", "pink"], default: "default" }
              - name: "carousel"
                label: "Carousel images"
                widget: "list"
                required: false
                max: 10
                summary: "{{fields.caption}}"
                fields:
                  - { name: "image",   label: "Image",   widget: "image" }
                  - { name: "caption", label: "Caption", widget: "string", required: false }
  # ============================================================
  # SITE SETTINGS  →  data/settings.json  (single file, global values)
  # ============================================================
  - name: "settings"
    label: "Site settings"
    files:
      - name: "settings"
        label: "General"
        file: "data/settings.json"
        format: "json"
        fields:
          - name: "homeVideoUrl"
            label: "Homepage hero video (YouTube URL)"
            widget: "string"
            hint: "The looping video on the left side of the homepage. Paste any YouTube link (watch, youtu.be, or embed URL all work)."
  # ============================================================
  # RANDOM PAGE (Instagram grid)  →  data/random.json  (file collection)
  # Each tile is its own file in data/random/. A GitHub Action
  # (.github/workflows/build-random.yml) rebuilds data/random.json — what the
  # site reads — on every push, stripping internal fields (name, order).
  # As a FOLDER collection, Sveltia shows a grid of thumbnail cards, keeps the
  # "New" button pinned top-right, and lets you sort the grid.
  # ============================================================
  - name: "random"
    label: "Random page"
    label_singular: "Tile"
    folder: "data/random"
    create: true
    format: "json"
    extension: "json"
    identifier_field: "url"
    slug: "tile-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{fields.name}}  ·  {{fields.kind}}  ·  {{fields.url}}"
    thumbnail: "thumb"
    sortable_fields: ["order", "name", "url"]
    fields:
      - { name: "name",  label: "Name (internal only)", widget: "string", required: false, hint: "Just for you — a quick label to recognise the tile in the grid. Not shown on the site." }
      - { name: "url",   label: "Instagram URL", widget: "string", hint: "Full post URL, e.g. https://www.instagram.com/p/XXXXXXXXX/" }
      - { name: "kind",  label: "Type", widget: "select", options: ["video", "image"], default: "video" }
      - { name: "thumb", label: "Thumbnail (optional)", widget: "image", required: false, hint: "Square image shown on the card and grid. If empty, the live Instagram embed is used on the site." }
      - { name: "order", label: "Sort order (optional)", widget: "number", value_type: "int", required: false, hint: "Optional pin: lower number = higher up. Blank = auto, newest first." }
