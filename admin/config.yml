backend:
  name: github
  repo: bootlegpirates/cptnkid-site
  branch: main
# Where uploaded images are stored / linked from.
# Working thumbs live at the repo root under images/uploads and the site
# serves them from /images/uploads, so media_folder must point there too
# (NOT static/images/uploads, or new uploads 404 on the live site).
media_folder: "images/uploads"
public_folder: "/images/uploads"
collections:
  # ============================================================
  # TIMELINE / POSTS  →  data/posts.json   (unchanged)
  # ============================================================
  - name: "content"
    label: "Posts"
    files:
      - name: "posts"
        label: "All posts"
        file: "data/posts.json"
        format: "json"
        fields:
          - name: "posts"
            label: "Posts"
            label_singular: "Post"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "title",       label: "Title",                           widget: "string" }
              - { name: "category",    label: "Category",                        widget: "select", options: ["Movies", "Anime", "Docs", "Work"] }
              - { name: "rating",      label: "Rating (0-5 stars)",              widget: "number", value_type: "int", min: 0, max: 5, default: 0 }
              - { name: "description", label: "Description",                     widget: "text" }
              - { name: "tags",        label: "Tags (comma separated)",          widget: "string", required: false }
              - { name: "featured",    label: "Featured on homepage",            widget: "boolean", default: false }
              - { name: "image",       label: "Main image",                      widget: "image",  required: false }
              - { name: "video",       label: "Detail-page video (YouTube URL)", widget: "string", required: false }
              - name: "carousel"
                label: "Carousel images"
                widget: "list"
                required: false
                max: 10
                summary: "{{fields.caption}}"
                fields:
                  - { name: "image",   label: "Image",   widget: "image" }
                  - { name: "caption", label: "Caption", widget: "string", required: false }
  # ============================================================
  # RANDOM PAGE (Instagram grid)  →  data/random.json  (file collection)
  # Edits data/random.json directly, exactly like the Posts collection.
  # The top-level key in random.json is "links", so the list field MUST be
  # named "links" or the site won't find the tiles after a save.
  # ============================================================
  - name: "random"
    label: "Random page"
    files:
      - name: "random"
        label: "Instagram grid"
        file: "data/random.json"
        format: "json"
        fields:
          - name: "links"
            label: "Tiles"
            label_singular: "Tile"
            widget: "list"
            summary: "{{fields.kind}}  ·  {{fields.url}}"
            fields:
              - { name: "url",   label: "Instagram URL", widget: "string", hint: "Full post URL, e.g. https://www.instagram.com/p/XXXXXXXXX/" }
              - { name: "kind",  label: "Type", widget: "select", options: ["video", "image"], default: "video" }
              - { name: "thumb", label: "Thumbnail (optional)", widget: "image", required: false, hint: "Square image shown on the card/grid. If empty, the live Instagram embed is used on the site." }
