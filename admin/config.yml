backend:
  name: github
  repo: bootlegpirates/cptnkid-site
  branch: main

# Where uploaded images are stored / linked from.
# This is a plain static site rooted at the repo root — there is NO `static/`
# folder — so media must live in `images/uploads`, matching the public path.
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ============================================================
  # TIMELINE / POSTS  →  data/posts.json   (unchanged)
  # ============================================================
  - name: "content"
    label: "Posts"
    files:
      - name: "posts"
        label: "All posts"
        file: "data/posts.json"
        format: "json"
        fields:
          - name: "posts"
            label: "Posts"
            label_singular: "Post"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "title",       label: "Title",                           widget: "string" }
              - { name: "category",    label: "Category",                        widget: "select", options: ["Movies", "Anime", "Docs", "Work"] }
              - { name: "rating",      label: "Rating (0-5 stars)",              widget: "number", value_type: "int", min: 0, max: 5, default: 0 }
              - { name: "description", label: "Description",                     widget: "text" }
              - { name: "tags",        label: "Tags (comma separated)",          widget: "string", required: false }
              - { name: "featured",    label: "Featured on homepage",            widget: "boolean", default: false }
              - { name: "image",       label: "Main image",                      widget: "image",  required: false }
              - { name: "video",       label: "Detail-page video (YouTube URL)", widget: "string", required: false }
              - name: "carousel"
                label: "Carousel images"
                widget: "list"
                required: false
                max: 10
                summary: "{{fields.caption}}"
                fields:
                  - { name: "image",   label: "Image",   widget: "image" }
                  - { name: "caption", label: "Caption", widget: "string", required: false }

  # ============================================================
  # RANDOM PAGE (Instagram grid)  →  one file per tile in data/random/
  # A GitHub Action rebuilds data/random.json (what the site reads) on push.
  # As a FOLDER collection, Sveltia shows a clickable grid of thumbnail cards.
  # ============================================================
  - name: "random"
    label: "Random page"
    label_singular: "Tile"
    folder: "data/random"
    create: true
    format: "json"
    extension: "json"
    identifier_field: "url"
    slug: "tile-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{fields.kind}}  ·  {{fields.url}}"
    thumbnail: "thumb"
    sortable_fields: ["order", "url"]
    fields:
      - { name: "url",   label: "Instagram URL", widget: "string", hint: "Full post URL, e.g. https://www.instagram.com/p/XXXXXXXXX/" }
      - { name: "kind",  label: "Type", widget: "select", options: ["video", "image"], default: "video" }
      - { name: "thumb", label: "Thumbnail (optional)", widget: "image", required: false, hint: "Square image shown on the card and grid. If empty, the live Instagram embed is used on the site." }
      - { name: "order", label: "Sort order (optional)", widget: "number", value_type: "int", required: false, hint: "Lower shows first. Blank = ordered by creation time." }
