backend:
  name: github
  repo: bootlegpirates/cptnkid-site
  branch: main

# Uploaded images live at the repo root under images/uploads and are served
# from /images/uploads on the live site, so media_folder must point there too
# (NOT static/images/uploads, or new uploads 404 on prod).
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ============================================================
  # HOMEPAGE POSTS  ->  data/posts.json   (the film / anime / doc catalogue)
  # These are the paginated cards on the homepage. "type" drives the
  # Movies / Anime / Documentary nav filter, so it MUST be one of
  # movies | anime | documentary (lowercase). The trailer on the detail
  # page is auto-searched on YouTube from the title + year.
  # ============================================================
  - name: "posts"
    label: "Homepage posts"
    files:
      - name: "posts"
        label: "All posts"
        file: "data/posts.json"
        format: "json"
        fields:
          - name: "posts"
            label: "Posts"
            label_singular: "Post"
            widget: "list"
            summary: "{{fields.title}} ({{fields.year}})"
            fields:
              - { name: "title",    label: "Title",     widget: "string" }
              - { name: "year",     label: "Year",      widget: "string" }
              - name: "type"
                label: "Type"
                widget: "select"
                options: ["movies", "anime", "documentary"]
                default: "movies"
                hint: "Drives the Movies / Anime / Documentary filter. Must be lowercase."
              - { name: "director", label: "Director",  widget: "string" }
              - name: "rating"
                label: "Rating (0-5)"
                widget: "number"
                value_type: "float"
                min: 0
                max: 5
                step: 0.1
                default: 4
              - { name: "duration", label: "Duration",           widget: "string", hint: "e.g. 95 mins" }
              - { name: "rt",       label: "Rotten Tomatoes",     widget: "string", required: false, hint: "e.g. 96%" }
              - { name: "lb",       label: "Letterboxd",          widget: "string", required: false, hint: "e.g. 4.2" }
              - { name: "synopsis", label: "Synopsis",            widget: "text" }
              - name: "pluses"
                label: "Pluses"
                widget: "list"
                required: false
                field: { name: "text", label: "Plus", widget: "string" }
              - name: "minuses"
                label: "Minuses"
                widget: "list"
                required: false
                field: { name: "text", label: "Minus", widget: "string" }
              - name: "images"
                label: "Carousel images"
                widget: "image"
                required: false
                multiple: true
                hint: "Upload multiple images at once to fill this post's carousel (shown left-to-right). If empty, placeholder tiles show."
              - { name: "youtube", label: "YouTube video URL", widget: "string", required: false, hint: "Full YouTube link for this post's trailer/video. If blank, one is auto-searched from title + year." }
              - { name: "videoThumb", label: "Video thumbnail (optional)", widget: "image", required: false, hint: "Poster shown before the video plays. If blank, the YouTube thumbnail is used automatically." }

  # ============================================================
  # ANIME TV  ->  data/anime-tv.json
  # The YouTube streams that play inside the CRT / camcorder overlay
  # (shown when the Anime nav is selected and you open TV). "dur" is the
  # video length in seconds; the player picks a random start up to ~85% of
  # it, so set it roughly to the real length. Long streams can add an
  # optional "maxStart" cap (seconds).
  # ============================================================
  - name: "anime_tv"
    label: "Anime TV"
    files:
      - name: "anime_tv"
        label: "Playlist"
        file: "data/anime-tv.json"
        format: "json"
        fields:
          - name: "videos"
            label: "Videos"
            label_singular: "Video"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "title", label: "Title (internal)", widget: "string", required: false, hint: "A label to recognise the stream. Not shown on the site." }
              - { name: "url",   label: "YouTube URL",       widget: "string", hint: "Any YouTube link works (watch, youtu.be, or embed)." }
              - name: "dur"
                label: "Length (seconds)"
                widget: "number"
                value_type: "int"
                default: 600
                hint: "Approx video length in seconds. Random start goes up to ~85% of this."
              - name: "maxStart"
                label: "Max random start (seconds, optional)"
                widget: "number"
                value_type: "int"
                required: false
                hint: "Only needed for very long streams you want to cap."
              - { name: "order", label: "Sort order", widget: "number", value_type: "int", required: false }

  # ============================================================
  # AMSTERDAM THEME  ->  data/amsterdam.json
  # The looping background videos for the Amsterdam ("video") theme.
  # maxSeconds is the highest random start point the player will jump to,
  # so keep it a bit below the video's real length.
  # ============================================================
  - name: "amsterdam"
    label: "Amsterdam theme"
    files:
      - name: "amsterdam"
        label: "Background videos"
        file: "data/amsterdam.json"
        format: "json"
        fields:
          - name: "videos"
            label: "Videos"
            label_singular: "Video"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "title", label: "Title (internal)", widget: "string", required: false }
              - { name: "url",   label: "YouTube URL",      widget: "string", hint: "Any YouTube link works." }
              - name: "maxSeconds"
                label: "Max random start (seconds)"
                widget: "number"
                value_type: "int"
                required: false
                default: 0
                hint: "Highest point the loop may start from. Set a bit below the clip length. 0 = always start at the beginning."
              - { name: "order", label: "Sort order", widget: "number", value_type: "int", required: false }

# ============================================================
  # RANDOM  ->  data/random.json   (the thumbnail grid)
  # Each item is a linked thumbnail. Clicking a tile opens the Link URL in a
  # new tab; "video" adds a small play badge so you can tell it apart. The
  # Thumbnail is the image shown in the grid.
  # ============================================================
  - name: "random"
    label: "Random"
    files:
      - name: "items"
        label: "Grid items"
        file: "data/random.json"
        format: "json"
        fields:
          - name: "links"
            label: "Items"
            label_singular: "Item"
            widget: "list"
            summary: "{{fields.kind}} — {{fields.url}}"
            fields:
              - { name: "url", label: "Link URL", widget: "string", hint: "Instagram or other post URL" }
              - name: "kind"
                label: "Kind"
                widget: "select"
                options: ["image", "video"]
                default: "image"
              - { name: "thumb", label: "Thumbnail", widget: "image" }

    # ============================================================
  # SITE SETTINGS  ->  data/settings.json  (single file, global values)
  # ============================================================
  - name: "settings"
    label: "Site settings"
    files:
      - name: "settings"
        label: "General"
        file: "data/settings.json"
        format: "json"
        fields:
          - { name: "wordmark", label: "Wordmark / logo text", widget: "string", required: false, hint: "The spinning wordmark text, e.g. BOOTLEG PIRATES & STUDIOS &" }
